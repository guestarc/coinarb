[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coinarb"
version = "0.3.0"
description = "Dealer-to-dealer physical precious metals arbitrage scanner"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["coinarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
